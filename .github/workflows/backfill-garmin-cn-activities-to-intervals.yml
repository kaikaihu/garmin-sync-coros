name: backfill-garmin-cn-activities-to-intervals

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Inclusive China-local start date (YYYY-MM-DD)'
        required: true
        default: '2026-01-01'
        type: string
      end_date:
        description: 'Inclusive China-local end date (blank = today)'
        required: false
        type: string
      upload:
        description: 'Upload only activities proven missing'
        required: true
        default: false
        type: boolean
      max_upload:
        description: 'Optional safety canary: maximum number to upload'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: garmin-cn-activities-to-intervals
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GARMIN_CN_GARTH_TOKEN: ${{ secrets.GARMIN_CN_GARTH_TOKEN }}
      GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
      START_DATE: ${{ inputs.start_date }}
      END_DATE: ${{ inputs.end_date }}
      UPLOAD: ${{ inputs.upload == true }}
      MAX_UPLOAD: ${{ inputs.max_upload }}

    steps:
      - name: Check out the verified isolated implementation
        uses: actions/checkout@v4
        with:
          ref: 7d74fe8d0ec802e69ca61b62145e6a98096ba28d

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify activity backfill tests
        run: |
          python -m unittest \
            tests/test_garmin_client_session.py \
            tests/test_intervals_client.py \
            tests/test_garmin_intervals_activity_backfill.py -v

      - name: Compare inventories and optionally backfill
        shell: bash
        run: |
          args=(--start "$START_DATE")
          if [[ -n "$END_DATE" ]]; then
            args+=(--end "$END_DATE")
          fi
          if [[ "$UPLOAD" == "true" ]]; then
            args+=(--upload)
          fi
          if [[ -n "$MAX_UPLOAD" ]]; then
            args+=(--max-upload "$MAX_UPLOAD")
          fi
          python -m scripts.garmin.garmin_intervals_activity_backfill "${args[@]}"
