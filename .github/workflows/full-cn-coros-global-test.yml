name: full-cn-coros-global-test

on:
  push:
    branches:
      - feat/garmin-global-sync
    paths:
      - '.github/workflows/full-cn-coros-global-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GARMIN_AUTH_DOMAIN: ${{ secrets.GARMIN_AUTH_DOMAIN }}
      GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      GARMIN_NEWEST_NUM: ${{ secrets.GARMIN_NEWEST_NUM }}
      COROS_EMAIL: ${{ secrets.COROS_EMAIL }}
      COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
      GARMIN_GLOBAL_EMAIL: ${{ secrets.GARMIN_GLOBAL_EMAIL }}
      GARMIN_GLOBAL_PASSWORD: ${{ secrets.GARMIN_GLOBAL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Garmin CN to COROS
        run: python scripts/garmin/garmin_sync_coros.py
      - name: Garmin CN activity files to Garmin Global
        run: python scripts/garmin/garmin_sync_global.py
