name: garmin-global-live-test

on:
  push:
    branches:
      - feat/garmin-global-sync
    paths:
      - '.github/workflows/garmin-global-live-test.yml'
      - 'scripts/garmin/garmin_sync_global.py'

jobs:
  test-global:
    runs-on: ubuntu-latest
    env:
      GARMIN_GLOBAL_EMAIL: ${{ secrets.GARMIN_GLOBAL_EMAIL }}
      GARMIN_GLOBAL_PASSWORD: ${{ secrets.GARMIN_GLOBAL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Garmin Global sync module
        run: |
          python scripts/garmin/garmin_sync_global.py
