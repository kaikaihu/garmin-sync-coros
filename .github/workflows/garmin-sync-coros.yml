name: garmin-sync-coros

on:
  workflow_dispatch:
  push:
    branches:
      - master
  schedule:
    - cron: '0 1,7,14 * * ?'
env:
  GITHUB_NAME: kaikaihu
  GITHUB_EMAIL: hu_kai@outlook.com
  ## 佳明配置
  GARMIN_AUTH_DOMAIN: ${{ secrets.GARMIN_AUTH_DOMAIN }}
  GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
  GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
  GARMIN_NEWEST_NUM: ${{ secrets.GARMIN_NEWEST_NUM }}

  ## Coros配置
  COROS_EMAIL: ${{ secrets.COROS_EMAIL }}
  COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'
      # from pdm
      - name: Set Variables
        id: set_variables
        run: |
          echo "::set-output name=PY::$(python -c 'import hashlib, sys;print(hashlib.sha256(sys.version.encode()+sys.executable.encode()).hexdigest())')"
          echo "::set-output name=PIP_CACHE::$(pip cache dir)"
      - name: Cache PIP
        uses: actions/cache@v3
        with:
          path: ${{ steps.set_variables.outputs.PIP_CACHE }}
          key: Ubuntu-pip-${{ steps.set_variables.outputs.PY }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        if: steps.pip-cache.outputs.cache-hit != 'true'
      - name: Run Garmin Sync
        run: |
          python scripts/garmin/garmin_sync_coros.py

      # Garmin Global is an independent sidecar. It prepares its own retry queue
      # while the original Python 3.10 Garmin CN dependencies are still active.
      - name: Prepare Garmin Global Sync
        continue-on-error: true
        run: |
          python scripts/garmin/garmin_global_prepare.py

      # Modern Garmin Global auth requires Python 3.12 and is intentionally
      # isolated from the original Garmin -> COROS dependency set.
      - name: Set up Python 3.12 for Garmin Global
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Garmin Global dependencies
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-global.txt
      - name: Run Garmin Global Sync
        continue-on-error: true
        env:
          GARMIN_GLOBAL_EMAIL: ${{ secrets.GARMIN_GLOBAL_EMAIL }}
          GARMIN_GLOBAL_PASSWORD: ${{ secrets.GARMIN_GLOBAL_PASSWORD }}
        run: |
          python scripts/garmin/garmin_sync_global.py

      - name: Push new cookie
        run: |
          git config --local user.email "${{ env.GITHUB_EMAIL }}"
          git config --local user.name "${{ env.GITHUB_NAME }}"
          git add .
          git commit -m 'update garmin activity' || echo "nothing to commit"
          git push || echo "nothing to push"
