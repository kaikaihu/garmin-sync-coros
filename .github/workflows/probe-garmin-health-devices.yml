name: probe-garmin-health-devices
run-name: Token-only Global device probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/garmin-cn-global-health
    paths:
      - 'tests/test_garmin_client_session.py'
      - 'tests/test_garmin_global_token_bootstrap.py'
      - 'tests/test_garmin_health_device_probe.py'
      - 'scripts/garmin/garmin_client.py'
      - 'scripts/garmin/garmin_global_token_bootstrap.py'
      - 'scripts/garmin/garmin_health_device_probe.py'
      - '.github/workflows/probe-garmin-health-devices.yml'

jobs:
  test-and-probe:
    runs-on: ubuntu-latest
    env:
      GARMIN_GLOBAL_GARTH_TOKEN: ${{ secrets.GARMIN_GLOBAL_GARTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit test redaction
        run: |
          python -m unittest \
            tests/test_garmin_client_session.py \
            tests/test_garmin_global_token_bootstrap.py \
            tests/test_garmin_health_device_probe.py -v
      - name: Probe Garmin Global devices (read-only, token only)
        if: ${{ env.GARMIN_GLOBAL_GARTH_TOKEN != '' }}
        env:
          GARMIN_PROBE_REGION: GLOBAL
          GARMIN_PROBE_GARTH_TOKEN: ${{ env.GARMIN_GLOBAL_GARTH_TOKEN }}
        run: python scripts/garmin/garmin_health_device_probe.py
      - name: Explain skipped Global probe
        if: ${{ env.GARMIN_GLOBAL_GARTH_TOKEN == '' }}
        run: |
          echo "GARMIN_GLOBAL_GARTH_TOKEN is not configured."
          echo "The probe intentionally skips instead of attempting password login."
