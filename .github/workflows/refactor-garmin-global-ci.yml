name: refactor-garmin-global-ci

on:
  push:
    branches:
      - refactor/isolate-garmin-global

# Temporary CI used only while isolating the Garmin Global sidecar.
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Garmin Global unit tests
        run: |
          python -m unittest discover -s scripts/tests/garmin_global -p 'test_*.py' -v
