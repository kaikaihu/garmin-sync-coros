name: sync-garmin-cn-health-to-intervals

on:
  workflow_dispatch:
    inputs:
      end_date:
        description: 'Last China-local date to process (YYYY-MM-DD; blank = today)'
        required: false
        type: string
      days:
        description: 'Number of days ending on end_date'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '3'
          - '7'
      dry_run:
        description: 'Read and validate only; do not write Intervals.icu'
        required: true
        default: true
        type: boolean
  schedule:
    # 10:15 Asia/Shanghai. GitHub evaluates cron in UTC.
    - cron: '15 2 * * *'

permissions:
  contents: read

concurrency:
  group: garmin-cn-health-to-intervals
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GARMIN_CN_GARTH_TOKEN: ${{ secrets.GARMIN_CN_GARTH_TOKEN }}
      GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      GARMIN_DISPLAY_NAME: ${{ secrets.GARMIN_DISPLAY_NAME }}
      INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
      SYNC_END_DATE: ${{ inputs.end_date }}
      SYNC_DAYS: ${{ inputs.days || '3' }}
      SYNC_UPLOAD: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}

    steps:
      - name: Check out the verified isolated implementation
        uses: actions/checkout@v4
        with:
          ref: 1cf3fb235f10d36c7d66ad789d059756389ae9f2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify health sync tests
        run: |
          python -m unittest \
            tests/test_garmin_cn_token_bootstrap.py \
            tests/test_garmin_client_session.py \
            tests/test_garmin_health_intervals_sync.py \
            tests/test_intervals_client.py -v

      - name: Read Garmin China wellness and sync Intervals.icu
        shell: bash
        run: |
          args=(--days "$SYNC_DAYS")
          if [[ -n "$SYNC_END_DATE" ]]; then
            args+=(--date "$SYNC_END_DATE")
          fi
          if [[ "$SYNC_UPLOAD" == "true" ]]; then
            args+=(--upload)
          else
            args+=(--dry-run)
          fi
          python -m scripts.garmin.garmin_health_intervals_sync "${args[@]}"
