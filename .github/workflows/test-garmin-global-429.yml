name: test-garmin-global-429

on:
  push:
    branches:
      - fix/garmin-global-429

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run Garmin Global unit test
        run: python -m unittest tests/test_garmin_global_client.py
