name: test-garmin-global-429

on:
  push:
    branches:
      - fix/garmin-global-429

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run Garmin Global unit test
        run: python -m unittest tests/test_garmin_global_client.py

  live-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install existing Garmin CN dependencies
        run: pip install -r requirements.txt
      - name: Download latest Garmin CN activity for probe
        env:
          GARMIN_AUTH_DOMAIN: ${{ secrets.GARMIN_AUTH_DOMAIN }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import tempfile
          import zipfile
          from pathlib import Path

          from scripts.garmin.garmin_client import GarminClient

          client = GarminClient(
              os.environ['GARMIN_EMAIL'],
              os.environ['GARMIN_PASSWORD'],
              os.environ.get('GARMIN_AUTH_DOMAIN', 'CN'),
              1,
          )
          activities = client.getActivities(0, 1)
          if not activities:
              raise SystemExit('No Garmin CN activity found')
          activity_id = activities[0]['activityId']
          payload = client.downloadFitActivity(activity_id)

          zip_path = Path('/tmp/garmin-global-latest.zip')
          zip_path.write_bytes(payload)
          with zipfile.ZipFile(zip_path, 'r') as archive:
              fit_members = [m for m in archive.infolist() if m.filename.lower().endswith('.fit') and not m.is_dir()]
              if not fit_members:
                  raise SystemExit('No FIT member found in latest Garmin CN activity')
              member = fit_members[0]
              Path('/tmp/garmin-global-latest.fit').write_bytes(archive.read(member))
          print('GARMIN_CN_LATEST_DOWNLOADED=' + str(activity_id))
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Garmin Global dependencies
        run: pip install -r requirements-global.txt
      - name: Upload latest activity to Garmin Global with modern auth
        env:
          GARMIN_GLOBAL_EMAIL: ${{ secrets.GARMIN_GLOBAL_EMAIL }}
          GARMIN_GLOBAL_PASSWORD: ${{ secrets.GARMIN_GLOBAL_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from scripts.garmin.garmin_global_client import create_global_uploader

          uploader = create_global_uploader(
              os.environ['GARMIN_GLOBAL_EMAIL'],
              os.environ['GARMIN_GLOBAL_PASSWORD'],
              '/tmp/garmin-global-auth-probe',
          )
          status = uploader.upload_activity('/tmp/garmin-global-latest.fit')
          print('GARMIN_GLOBAL_UPLOAD_STATUS=' + status)
          if status not in {'SUCCESS', 'DUPLICATE_ACTIVITY'}:
              raise SystemExit(1)
          PY
