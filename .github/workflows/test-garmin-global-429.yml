name: test-garmin-global-429

on:
  push:
    branches:
      - fix/garmin-global-429

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run Garmin Global unit tests
        run: python -m unittest discover -s tests -p 'test_garmin_global_*.py'

  production-path:
    runs-on: ubuntu-latest
    env:
      GARMIN_AUTH_DOMAIN: ${{ secrets.GARMIN_AUTH_DOMAIN }}
      GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      GARMIN_GLOBAL_EMAIL: ${{ secrets.GARMIN_GLOBAL_EMAIL }}
      GARMIN_GLOBAL_PASSWORD: ${{ secrets.GARMIN_GLOBAL_PASSWORD }}
      GARMIN_GLOBAL_PAGE_SIZE: '1'
      GARMIN_GLOBAL_MAX_RETRY_PER_RUN: '1'
      GARMIN_GLOBAL_STATE_PATH: /tmp/garmin-global-state.json
      GARMIN_GLOBAL_MANIFEST_PATH: /tmp/garmin-global-manifest.json
      GARMIN_GLOBAL_QUEUE_DIR: /tmp/garmin-global-queue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install existing Garmin CN dependencies
        run: pip install -r requirements.txt
      - name: Prepare Global retry queue from Garmin CN
        run: python scripts/garmin/garmin_global_prepare.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Garmin Global dependencies
        run: pip install -r requirements-global.txt
      - name: Run Garmin Global sync
        run: python scripts/garmin/garmin_sync_global.py
      - name: Verify Global retry state
        run: |
          python - <<'PY'
          import json
          with open('/tmp/garmin-global-state.json', 'r', encoding='utf-8') as handle:
              state = json.load(handle)
          assert state['synced_activity_ids'], state
          assert state['pending_activity_ids'] == [], state
          print('GARMIN_GLOBAL_RETRY_STATE_OK')
          PY
