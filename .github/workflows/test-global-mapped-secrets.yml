name: test-global-mapped-secrets

on:
  push:
    branches:
      - feat/garmin-global-sync
    paths:
      - '.github/workflows/test-global-mapped-secrets.yml'
      - 'scripts/garmin/test_global_upload_mapped_secrets.py'

jobs:
  live-upload-test:
    runs-on: ubuntu-latest
    env:
      GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      GARMIN_GLOBAL_EMAIL: ${{ secrets.GARMIN_GLOBAL_EMAIL }}
      GARMIN_GLOBAL_PASSWORD: ${{ secrets.GARMIN_GLOBAL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Probe Garmin Global using independent secrets
        run: |
          python scripts/garmin/test_global_upload_mapped_secrets.py
